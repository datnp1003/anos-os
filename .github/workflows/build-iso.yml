name: Build AnosOS ISO (x86_64)

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      anos_version:
        description: 'Anos core version, e.g. v0.11.0'
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-iso:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends genisoimage squashfs-tools cpio python3 curl linux-image-generic busybox-static udhcpc xorriso
      - name: Build ISO
        run: bash iso/build-iso.sh anos-os-linux-amd64.iso amd64 "${{ inputs.anos_version || 'v0.11.0' }}"
      - name: Upload
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "${{ github.ref_name }}" &>/dev/null || \
            gh release create "${{ github.ref_name }}" --title "${{ github.ref_name }}" \
              --notes "AnosOS ISO (Anos Core ${{ inputs.anos_version || 'v0.11.0' }}) — auto-built by CI"
          gh release upload "${{ github.ref_name }}" anos-os-linux-amd64.iso --clobber
