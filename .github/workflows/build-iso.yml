name: Build AnosOS ISO (x86_64)

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      anos_version:
        description: 'Anos core version, e.g. v0.11.0'
        required: true
        default: 'v0.11.0'
        type: string

permissions:
  contents: write

jobs:
  build-iso:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            debootstrap \
            squashfs-tools \
            xorriso \
            grub-pc-bin \
            grub-efi-amd64-bin \
            grub-common \
            mtools \
            dosfstools \
            curl \
            wget \
            git \
            ca-certificates

      - name: Build ISO
        run: |
          chmod +x iso/build-iso.sh
          sudo bash iso/build-iso.sh anos-os-linux-amd64.iso amd64 "${{ inputs.anos_version || 'v0.11.0' }}"

      - name: Upload to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "${{ github.ref_name }}" &>/dev/null || \
            gh release create "${{ github.ref_name }}" \
              --title "${{ github.ref_name }}" \
              --notes "AnosOS ISO (Ubuntu Jammy base + Anos Core ${{ inputs.anos_version || 'v0.11.0' }})"
          gh release upload "${{ github.ref_name }}" anos-os-linux-amd64.iso anos-os-linux-amd64.iso.sha256 --clobber
