name: Build AnosOS ISO (x86_64)

on:
  push:
    tags: ['os-v*']
  workflow_dispatch:
    inputs:
      anos_version:
        description: 'Anos core version, e.g. v0.11.0'
        required: true
        type: string
      tag:
        description: 'Release tag for this ISO, e.g. os-v0.11.0'
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-iso:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout anos-os
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Install ISO tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            genisoimage squashfs-tools cpio python3 curl \
            linux-image-generic busybox-static udhcpc

      - name: Build rootfs + ISO
        run: |
          set -euo pipefail
          ANOS_VER="${{ inputs.anos_version || 'latest' }}"
          WORK="/tmp/anos-os-build"
          rm -rf "$WORK" /tmp/anos-dl
          mkdir -p /tmp/anos-dl "$WORK"/{bin,sbin,boot,dev,etc/init.d,home/anos,opt/anos/{config,skills},proc,run,sys,tmp,usr/bin,var/log}

          # --- Download anos binaries from GitHub Release ---
          echo "📥 Downloading Anos $ANOS_VER..."
          DL="https://github.com/datnp1003/anos/releases/download/$ANOS_VER"
          
          if curl -fsSL "$DL/anosd-linux-x86_64" -o /tmp/anos-dl/anosd; then
            echo "  ✅ anosd downloaded"
          else
            echo "  ⚠️ Trying tarball fallback..."
            curl -fsSL "$DL/anosd" -o /tmp/anos-dl/anosd || {
              echo "  ❌ Cannot download anosd. Build anos first."
              exit 1
            }
          fi

          if curl -fsSL "$DL/anos-cli-linux-x86_64" -o /tmp/anos-dl/anos-cli; then
            echo "  ✅ anos-cli downloaded"
          else
            curl -fsSL "$DL/anos-cli" -o /tmp/anos-dl/anos-cli || exit 1
          fi

          # Download source assets (skills + prompt) via tarball
          echo "📥 Downloading skills & assets..."
          SOURCE_URL=$(curl -s "https://api.github.com/repos/datnp1003/anos/releases/tags/$ANOS_VER" \
            | grep '"browser_download_url"' | grep 'tar.gz' | head -1 \
            | sed 's/.*"browser_download_url": "\(.*\)".*/\1/')
          
          if [ -n "$SOURCE_URL" ]; then
            curl -fsSL "$SOURCE_URL" -o /tmp/anos-dl/source.tar.gz
            tar xzf /tmp/anos-dl/source.tar.gz -C /tmp/anos-dl/ --strip-components=1
          else
            echo "  ⚠️ No source tarball — cloning shallow..."
            git clone --depth 1 --branch "$ANOS_VER" https://github.com/datnp1003/anos.git /tmp/anos-dl/source 2>/dev/null || \
            git clone --depth 1 https://github.com/datnp1003/anos.git /tmp/anos-dl/source
            cp /tmp/anos-dl/source/ANOS-SYSTEM-PROMPT.md /tmp/anos-dl/
            cp -r /tmp/anos-dl/source/skills /tmp/anos-dl/
          fi

          chmod +x /tmp/anos-dl/anosd /tmp/anos-dl/anos-cli
          cp /tmp/anos-dl/anosd "$WORK/usr/bin/"
          cp /tmp/anos-dl/anos-cli "$WORK/usr/bin/"
          cp /tmp/anos-dl/ANOS-SYSTEM-PROMPT.md "$WORK/opt/anos/" 2>/dev/null || true
          cp -r /tmp/anos-dl/skills/* "$WORK/opt/anos/skills/" 2>/dev/null || cp -r /tmp/anos-dl/skills "$WORK/opt/anos/" 2>/dev/null || echo "  ⚠️ No skills"
          cp init/anos-init "$WORK/sbin/init"
          chmod +x "$WORK/sbin/init" "$WORK/usr/bin/anosd" "$WORK/usr/bin/anos-cli"

          # --- Busybox + symlinks ---
          cp /bin/busybox "$WORK/bin/busybox"
          chmod +x "$WORK/bin/busybox"
          "$WORK/bin/busybox" --install -s "$WORK/bin/" 2>/dev/null || true
          for u in sh ls cat echo mount umount ip ping modprobe mknod sleep grep mkdir ln rm mv cp \
                   getty login passwd su adduser addgroup id whoami tty clear head tail \
                   chmod chown kill ps df du tar gzip dd sync reboot poweroff; do
              [ -e "$WORK/bin/$u" ] || ln -sf /bin/busybox "$WORK/bin/$u" 2>/dev/null || true
          done
          mkdir -p "$WORK/sbin"
          ln -sf /bin/busybox "$WORK/sbin/getty" 2>/dev/null || true
          ln -sf /bin/busybox "$WORK/sbin/login" 2>/dev/null || true
          ln -sf /bin/busybox "$WORK/sbin/init" 2>/dev/null || true
          ln -sf /bin/busybox "$WORK/sbin/reboot" 2>/dev/null || true
          ln -sf /bin/busybox "$WORK/sbin/poweroff" 2>/dev/null || true
          cp /usr/sbin/udhcpc "$WORK/sbin/" 2>/dev/null || cp /sbin/udhcpc "$WORK/sbin/" 2>/dev/null || true

          # --- /etc/passwd + /etc/shadow + /etc/group ---
          ANOS_HASH=$(python3 -c "import crypt; print(crypt.crypt('anos', crypt.mksalt(crypt.METHOD_SHA512)))")
          ROOT_HASH=$(python3 -c "import crypt; print(crypt.crypt('root', crypt.mksalt(crypt.METHOD_SHA512)))")

          cat > "$WORK/etc/passwd" << PASSWD
root:x:0:0:root:/root:/bin/sh
daemon:x:1:1:daemon:/usr/sbin:/bin/false
bin:x:2:2:bin:/bin:/bin/false
sys:x:3:3:sys:/dev:/bin/false
sync:x:4:65534:sync:/bin:/bin/sync
anos:x:1000:1000:Anos AI User:/home/anos:/bin/sh
nobody:x:65534:65534:nobody:/nonexistent:/bin/false
PASSWD

          cat > "$WORK/etc/shadow" << SHADOW
root:${ROOT_HASH}:20000:0:99999:7:::
daemon:*:20000:0:99999:7:::
bin:*:20000:0:99999:7:::
sys:*:20000:0:99999:7:::
sync:*:20000:0:99999:7:::
anos:${ANOS_HASH}:20000:0:99999:7:::
nobody:*:20000:0:99999:7:::
SHADOW

          cat > "$WORK/etc/group" << GROUP
root:x:0:
daemon:x:1:
bin:x:2:
sys:x:3:
admin:x:100:anos
anos:x:1000:
nogroup:x:65534:
GROUP

          chmod 644 "$WORK/etc/passwd" "$WORK/etc/group"
          chmod 600 "$WORK/etc/shadow"

          # --- /etc/profile ---
          cat > "$WORK/etc/profile" << 'PROFILE'
#!/bin/sh
export PATH=/usr/bin:/bin:/sbin:/usr/sbin
export ANOS_DIR=/opt/anos
export ANOS_SOCKET=/tmp/anos.sock
ANOS_READY=false
[ -S /tmp/anos.sock ] && ANOS_READY=true
if [ "$(tty)" = "/dev/tty1" ] && [ "$(whoami)" = "anos" ]; then
    clear 2>/dev/null || true
    echo "🦾 AnosOS — Launching AI CLI..."
    if $ANOS_READY; then exec /usr/bin/anos-cli; fi
    echo "⚠️  Daemon not ready"; exec /bin/sh
fi
echo "🦾 AnosOS v0.11.0"
$ANOS_READY && echo " AI: ✅ Online" || echo " AI: ❌ Offline"
echo " Type 'anos-cli' for AI shell"
PROFILE

          # --- /etc/issue ---
          cat > "$WORK/etc/issue" << 'ISSUE'
          🦾 AnosOS — AI Native OS
          Default: anos / anos
          ⚠️  CHANGE PASSWORD on first login!

ISSUE

          # --- Kernel ---
          KERNEL=$(ls /boot/vmlinuz-* 2>/dev/null | head -1)
          cp "$KERNEL" "$WORK/boot/vmlinuz"
          echo "Kernel: $(basename "$KERNEL")"

          # --- Initrd ---
          echo "📦 Building initrd..."
          (cd "$WORK" && find . -path ./boot -prune -o -print | cpio -o -H newc 2>/dev/null) | gzip > "$WORK/boot/initrd.img"

          # --- GRUB ---
          mkdir -p "$WORK/boot/grub"
          cat > "$WORK/boot/grub/grub.cfg" << 'GRUB'
set timeout=5
set default=0
loadfont unicode

menuentry "🦾 AnosOS — AI Native OS" {
    linux /boot/vmlinuz console=tty1 quiet
    initrd /boot/initrd.img
}
menuentry "AnosOS — Verbose boot" {
    linux /boot/vmlinuz console=tty1
    initrd /boot/initrd.img
}
menuentry "AnosOS — Safe mode (root shell)" {
    linux /boot/vmlinuz console=tty1 init=/bin/sh
    initrd /boot/initrd.img
}
GRUB

          # --- ISO ---
          ISO="anos-os-linux-amd64.iso"
          echo "💿 Building $ISO..."
          genisoimage -R -r -J -V "ANOS_OS" -o "$ISO" -b boot/grub/grub.cfg -no-emul-boot "$WORK"
          SIZE=$(du -h "$ISO" | cut -f1)
          echo "✅ $ISO ($SIZE)"
          echo "iso_path=$ISO" >> "$GITHUB_ENV"

      - name: Create Release + Upload ISO
        env:
          GH_TOKEN: *** github.token }}
        run: |
          TAG="${{ inputs.tag || github.ref_name }}"
          ANOS_VER="${{ inputs.anos_version || 'latest' }}"
          gh release view "$TAG" &>/dev/null || \
            gh release create "$TAG" --title "$TAG" \
              --notes "AnosOS ISO (Anos Core $ANOS_VER) — auto-built by CI"
          gh release upload "$TAG" "${{ env.iso_path }}" --clobber

      - name: Summary
        run: |
          SIZE=$(du -h "${{ env.iso_path }}" | cut -f1)
          echo "## 🦾 AnosOS x86_64 ISO Ready" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Item | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|------|-------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| ISO | ${{ env.iso_path }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Size | $SIZE |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Anos Core | ${{ inputs.anos_version || 'latest' }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| User | anos / anos |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Root | root / root |" >> "$GITHUB_STEP_SUMMARY"
          echo "| tty1 | anos → auto anos-cli |" >> "$GITHUB_STEP_SUMMARY"
          echo "| tty2 | root shell |" >> "$GITHUB_STEP_SUMMARY"
          echo "| tty3 | admin shell |" >> "$GITHUB_STEP_SUMMARY"
